name: CI

on:
  push:
  pull_request:

jobs:
  test-eval-core:
    # Item 5 / D6: tests non-model logic only (label parsing, metrics,
    # confusion ranking, config loading). No GPU, no model weights — GitHub
    # Actions runners have neither, so evaluate.py's ML orchestration layer
    # is deliberately NOT imported here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: pip install -r requirements-core.txt
      - name: Run pure-logic unit tests
        run: python -m pytest tests/ -v

  test-full:
    # The whole suite on CPU with the pinned requirements: tiny random models, no weights. The serving tests skip
    # themselves when peft, httpx or the Qwen tokenizer is missing, so the tokenizer is fetched first and the job
    # fails if they did not run (a silent skip once dropped the suite from ~283 to ~141 tests unnoticed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies (CPU torch)
        run: |
          pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-serve.txt
      - name: Cache the tokenizer the tests use
        run: python -c "from transformers import AutoTokenizer; AutoTokenizer.from_pretrained('Qwen/Qwen2.5-1.5B-Instruct')"
      - name: Run tests
        run: python -m pytest tests -q -rs --junitxml=results.xml
      - name: Fail if the serving tests were skipped
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("results.xml").iter("testcase"))
          skipped = sum(c.find("skipped") is not None for c in cases)
          serving = [c for c in cases if "test_pointwise_serving" in c.get("classname", "") and c.find("skipped") is None]
          print(f"{len(cases)} tests, {skipped} skipped, {len(serving)} serving tests ran")
          assert len(serving) >= 90, "serving tests did not run (peft, httpx or the tokenizer missing?)"
          EOF

  image:
    # Builds the GPU image (the runner has no GPU) and checks the server's code imports inside it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the CUDA torch wheel
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Build
        run: docker build -t pointwise:ci .
      - name: Smoke check
        run: docker run --rm pointwise:ci python -c "import src.serve, src.serve_main; print('import ok')"
